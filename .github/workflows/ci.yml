name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Python ${{ matrix.python-version }} kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Pip güncelle
        run: python -m pip install --upgrade pip
      - name: Core ve geliştirme araçlarını kur
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy src/lina_core
      - name: Unit ve hafif integration testleri
        run: python -m pytest -m "not manual_integration and not model_integration"
      - name: Python kaynaklarını derle
        run: python -m compileall -q src
      - name: Package build
        run: python -m build
      - name: Dependency tutarlılığını denetle
        run: python -m pip check
      - name: Public repository audit
        run: python scripts/audit_public_repository.py
