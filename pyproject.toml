[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lina-core"
dynamic = ["version"]
description = "Local, provider-independent AI runtime foundation for Lina."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["ai", "local-ai", "inference", "runtime", "lina"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.10", "pytest>=8.2", "pytest-cov>=5", "ruff>=0.5"]
inference-transformers = ["accelerate>=0.30", "transformers>=4.41"]
inference-torch = ["torch>=2.2"]
inference-llama-cpp = ["llama-cpp-python>=0.3"]
training = ["accelerate>=0.30", "numpy>=1.26,<2.5.1; python_version < '3.12'", "numpy>=1.26; python_version >= '3.12'", "torch>=2.2", "transformers>=4.41"]
training-lora = ["peft>=0.11"]
training-all = ["accelerate>=0.30", "numpy>=1.26,<2.5.1; python_version < '3.12'", "numpy>=1.26; python_version >= '3.12'", "peft>=0.11", "torch>=2.2", "transformers>=4.41"]
all = ["accelerate>=0.30", "llama-cpp-python>=0.3", "numpy>=1.26,<2.5.1; python_version < '3.12'", "numpy>=1.26; python_version >= '3.12'", "peft>=0.11", "torch>=2.2", "transformers>=4.41"]

[project.scripts]
lina-core = "lina_core.cli:main"

[project.urls]
Homepage = "https://github.com/ilhanki/LinaCore"
Repository = "https://github.com/ilhanki/LinaCore"
Issues = "https://github.com/ilhanki/LinaCore/issues"
Documentation = "https://github.com/ilhanki/LinaCore/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/lina_core"]

[tool.hatch.version]
path = "src/lina_core/core/version.py"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["ı"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config -p no:pytest-qt"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "manual_integration: requires local model artifacts and optional ML dependencies",
  "model_integration: requires a user-supplied local model and optional ML dependencies",
]

[tool.coverage.run]
source = ["lina_core"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["src/lina_core"]
strict = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "peft", "peft.*", "torch", "torch.*", "transformers", "transformers.*"]
ignore_missing_imports = true
